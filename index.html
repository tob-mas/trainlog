  if(s.hyrox)Object.entries(HYROX).forEach(([k,b])=>s.hyrox.blocks[k].forEach((r,i)=>r.total!=null&&lines.push([`${b.name}${b.rounds>1?' R'+(i+1):''}`,fmtTime(r.total)])));
  (s.cardio||[]).forEach(x=>lines.push([x.machine,`${x.min||'–'} · ${x.dist||'–'} m`]));
  const maxL=s.pbs&&s.pbs.length?7:10;lines.slice(0,maxL).forEach(([a,b])=>{c.fillStyle='#fff';c.font=`600 38px ${F}`;let aa=a;while(c.measureText(aa).width>560)aa=aa.slice(0,-2);c.fillText(aa,80,y);c.fillStyle='rgba(255,255,255,.7)';c.font=`600 36px ${F}`;c.fillText(b,W-80-c.measureText(b).width,y);c.fillStyle='rgba(255,255,255,.08)';c.fillRect(80,y+24,W-160,2);y+=72;});
  if(lines.length>maxL){c.fillStyle='rgba(255,255,255,.5)';c.font=`600 30px ${F}`;c.fillText(`+${lines.length-maxL} more`,80,y);y+=60;}
  if(s.pbs&&s.pbs.length){y+=10;c.fillStyle=s.color;rr(c,80,y,W-160,90+Math.min(2,s.pbs.length-1)*56,28);c.fill();c.fillStyle=onColor(s.color);c.font=`800 36px ${F}`;s.pbs.slice(0,3).forEach((p,i)=>{c.fillText(`🏆 ${p.name} – ${p.val}`.slice(0,42),116,y+58+i*56);});}
  c.fillStyle='rgba(255,255,255,.35)';c.font=`600 26px ${F}`;c.fillText('Logged with TrainLog',80,H-70);
  if(window.__noShare){window.__card=cv.toDataURL('image/png');return;}
  cv.toBlob(b=>{const f=new File([b],'trainlog-'+ymd(s.date)+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(()=>{});else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();}},'image/png');}

/* ======================= TEMPLATES ======================= */
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function renderTemplates(){setHeader('Workouts',{right:`<button class="btn sm p" onclick="newTemplate()">+ New</button>`});
  const order=[1,2,3,4,5,6,0,''];const ts=[...DB.templates].sort((a,b)=>order.indexOf(a.day)-order.indexOf(b.day));
  $('#app').innerHTML=`<div class="card">${ts.map(t=>`<div class="li" onclick="go('editTemplate',${q(t.id)})"><div style="width:40px;height:40px;border-radius:12px;background:${t.color};color:${onColor(t.color)};display:flex;align-items:center;justify-content:center;font-weight:800;flex:none">${t.day!==''&&t.day!=null?DAYS[t.day].slice(0,2):'—'}</div><div class="grow"><b>${esc(t.name)}</b><div class="mut sm ell">${t.type==='strength'?t.exercises.map(e=>e.name).join(' · '):t.type==='run'?'Rotates A → B → C weekly':t.type==='hyrox'?'Pre-fatigue · Legs · Finisher':'Bike / row / ski erg'}</div></div><span class="chev">›</span></div>`).join('')}</div>
  <div class="mut sm" style="padding:0 4px">Tap a workout to change exercises, sets, reps, rest, colour and day. You can also tweak things on the fly mid-session.</div>`;}
function newTemplate(){const t={id:uid(),name:'New workout',type:'strength',day:'',color:PALETTE[DB.templates.length%PALETTE.length],exercises:[ex('New exercise')]};DB.templates.push(t);save();go('editTemplate',t.id);}
function tpl(){return DB.templates.find(x=>x.id===param);}
function renderEditTemplate(){const t=tpl();if(!t){view='templates';return render();}
  setHeader('Edit workout',{backBtn:true});
  let h=`<div class="card"><label style="margin-top:0">Name</label><input value="${esc(t.name)}" oninput="tpl().name=this.value;save()">
  <div class="field-row"><div><label>Type</label><select onchange="tpl().type=this.value;save();renderEditTemplate()">${[['strength','Strength'],['run','Run'],['hyrox','Hyrox'],['cardio','Cardio']].map(([k,n])=>`<option value="${k}" ${k===t.type?'selected':''}>${n}</option>`).join('')}</select></div>
  <div><label>Day</label><select onchange="tpl().day=this.value===''?'':+this.value;save()"><option value="">Any day</option>${[1,2,3,4,5,6,0].map(i=>`<option value="${i}" ${t.day===i?'selected':''}>${DAYS[i]}</option>`).join('')}</select></div></div>
  <label>Colour</label><div class="swatches">${PALETTE.map(c=>`<button class="${c===t.color?'on':''}" style="background:${c}" onclick="tpl().color='${c}';save();renderEditTemplate()"></button>`).join('')}</div></div>`;
  if(t.type==='strength'){h+=`<div class="sec">Exercises</div>`+t.exercises.map((e,i)=>`<div class="tpl-ex"><div class="row"><input class="grow" list="exList" value="${esc(e.name)}" onchange="tpl().exercises[${i}].name=this.value;save()"><button class="icon-btn" onclick="mvT(${i},-1)">↑</button><button class="icon-btn" onclick="mvT(${i},1)">↓</button><button class="icon-btn" style="color:var(--bad)" onclick="rmT(${i})">✕</button></div>
    <div class="field-row"><div><label>Sets</label><input inputmode="numeric" value="${e.sets}" onchange="tpl().exercises[${i}].sets=+this.value||1;save()"></div><div><label>Reps</label><input value="${esc(e.reps)}" onchange="tpl().exercises[${i}].reps=this.value;save()"></div><div><label>Rest (s)</label><input inputmode="numeric" value="${e.rest}" onchange="tpl().exercises[${i}].rest=+this.value||90;save()"></div></div></div>
    ${i<t.exercises.length-1?`<div class="link" style="--c:${t.color}"><button class="${e.group&&e.group===t.exercises[i+1].group?'on':''}" onclick="linkToggle(tpl().exercises,${i});save();renderEditTemplate()">${e.group&&e.group===t.exercises[i+1].group?'🔗 Superset':'+ superset'}</button></div>`:'<div style="height:10px"></div>'}`).join('')+exDatalist()+
    `<button class="btn block" onclick="tpl().exercises.push(ex('New exercise'));save();renderEditTemplate()">+ Add exercise</button>`;}
  else h+=`<div class="card mut sm">This is a ${t.type} session – its logging screen is built in (${t.type==='run'?'rotates A → B → C each week, intervals, pace & HR':t.type==='hyrox'?'round timers, station splits & targets':'machines, time, distance, HR'}).</div>`;
  h+=`<button class="btn ghost block danger" style="margin-top:16px" onclick="delTemplate()">Delete workout</button>`;$('#app').innerHTML=h;}
function mvT(i,d){const a=tpl().exercises,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];normalizeGroups(a);save();renderEditTemplate();}
function rmT(i){const a=tpl().exercises;const [x]=a.splice(i,1);normalizeGroups(a);save();renderEditTemplate();toast('Exercise removed',()=>{a.splice(i,0,x);save();renderEditTemplate();});}
function delTemplate(){const t=tpl();const i=DB.templates.indexOf(t);DB.templates.splice(i,1);save();go('templates');toast('Workout deleted',()=>{DB.templates.splice(i,0,t);save();render();});}

/* ======================= SETTINGS ======================= */
function renderSettings(){setHeader('Settings');const S=DB.settings;const m=+S.maxHR;
  let h=`<div class="sec">Appearance</div><div class="card"><div class="seg" style="margin:0">${[['auto','Auto'],['dark','Dark'],['light','Light']].map(([k,n])=>`<button class="${S.theme===k?'on':''}" onclick="DB.settings.theme='${k}';save();applyTheme();renderSettings()">${n}</button>`).join('')}</div></div>
  <div class="sec">Programme</div><div class="card"><label style="margin-top:0">Week 1 starts on (Monday)</label><input type="date" value="${S.startDate}" onchange="DB.settings.startDate=ymd(mondayOf(this.value));save();renderSettings()">
   <div class="mut xs" style="margin-top:6px">Week ${weekNo()} · this week's run: ${runOfWeek()} (${RUN_TYPES[runOfWeek()].name})${isDeload()?' · deload week':''}</div>
   <div class="field-row"><div><label>Deload every</label><input inputmode="numeric" value="${S.deloadEvery}" onchange="DB.settings.deloadEvery=+this.value||5;save()"></div><div><label>Weekly goal</label><input inputmode="numeric" value="${S.weeklyGoal}" onchange="DB.settings.weeklyGoal=+this.value||4;save()"></div><div><label>Default rest (s)</label><input inputmode="numeric" value="${S.defaultRest}" onchange="DB.settings.defaultRest=+this.value||90;save()"></div></div></div>
  <div class="sec">Equipment</div><div class="card"><div class="field-row"><div><label style="margin-top:0">Dumbbell jumps (kg)</label><input inputmode="decimal" value="${S.dbStep}" onchange="DB.settings.dbStep=+this.value||2;save()"></div><div><label style="margin-top:0">Cable / machine jumps</label><input inputmode="decimal" value="${S.machineStep}" onchange="DB.settings.machineStep=+this.value||2.5;save()"></div></div>
   <div class="field-row"><div><label>Barbell (kg)</label><input inputmode="decimal" value="${S.barKg}" onchange="DB.settings.barKg=+this.value||0;save()"></div><div><label>Smith bar (kg)</label><input inputmode="decimal" value="${S.smithBarKg}" onchange="DB.settings.smithBarKg=+this.value||0;save()"></div></div>
   <label>Plates available (tap to toggle)</label><div class="row wrap" style="gap:6px">${[25,20,15,10,5,2.5,1.25].map(p=>`<button class="chip" style="padding:7px 12px;font-size:14px;border:0;${S.plates.includes(p)?`background:${PLATE_COL[p]};color:#fff`:''}" onclick="togglePlate(${p})">${p}</button>`).join('')}</div>
   <div class="mut xs" style="margin-top:8px">Smith bars vary a lot – set it to 0 if you log plates only. Plate jumps = 2 × your smallest plate (${2*Math.min(...S.plates)} kg).</div></div>
  <div class="sec">Heart rate</div><div class="card"><label style="margin-top:0">Max heart rate (bpm)</label><input inputmode="numeric" value="${S.maxHR}" placeholder="e.g. 195" onchange="DB.settings.maxHR=this.value;save();renderSettings()">
   ${m?ZONES.map(z=>`<div class="li"><span class="zone" style="background:${z[3]};width:12px;height:12px"></span><span class="grow">${z[2]}</span><span class="mut sm">${z[0]}–${Math.min(100,z[1])}%</span><b class="num" style="width:84px;text-align:right">${Math.round(m*z[0]/100)}–${Math.round(m*Math.min(100,z[1])/100)}</b></div>`).join(''):'<div class="mut xs" style="margin-top:6px">Add it to see your zones and 4×4 target range. Best figure is the highest you\'ve seen on a hard effort.</div>'}</div>
  <div class="sec">Hyrox targets</div><div class="card">${Object.entries(HYROX).map(([k,b])=>`<div class="mut xs" style="font-weight:700;margin:6px 0 4px">${b.name.toUpperCase()}</div>${b.stations.map((n,i)=>`<div class="row" style="margin-bottom:6px"><span class="grow sm">${esc(n)}</span><input style="width:90px;text-align:center" inputmode="numeric" placeholder="m:ss" value="${tgt(k,i)?fmtTime(tgt(k,i)):''}" onchange="this.value=digitsToTime(this.value);setTgt('${k}',${i},this.value)"></div>`).join('')}`).join('')}<div class="mut xs">Live ahead/behind shows on the round timer.</div></div>
  <div class="sec">Garmin & data</div><div class="card"><button class="btn block" onclick="importRunPick()">⌚ Import run (GPX / TCX)</button><div class="mut xs" style="margin:6px 2px 12px">Garmin Connect website → activity → ⚙️ → Export to TCX or GPX → save to Files.</div>
   <button class="btn block" onclick="exportJSON()">⬇️ Export full backup (JSON)</button><button class="btn block" style="margin-top:8px" onclick="exportCSV()">⬇️ Export to Excel (CSV)</button>
   <label>Restore from backup</label><input type="file" accept=".json,application/json" onchange="importJSON(this.files[0])"></div>
  <div class="card"><button class="btn ghost block danger" onclick="if(confirm('Delete ALL workouts and settings?')&&confirm('Really? This cannot be undone.')){localStorage.removeItem(KEY);DB=load();save();go('home')}">Reset everything</button></div>
  <div class="mut xs center">TrainLog v${APP_VERSION} · ${DB.sessions.length} workouts logged</div>`;
  $('#app').innerHTML=h;}
function togglePlate(p){const a=DB.settings.plates;const i=a.indexOf(p);if(i>=0){if(a.length===1)return toast('Keep at least one plate');a.splice(i,1);}else a.push(p);save();renderSettings();}
function setTgt(k,i,v){const t=parseTime(v);if(t)DB.hyroxTargets[k+':'+i]=t;else delete DB.hyroxTargets[k+':'+i];save();}
function applyTheme(){const t=DB.settings.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelector('meta[name=theme-color]').content=dark?'#0b0d12':'#f2f3f7';}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{applyTheme();render();});

/* backup */
function download(name,text,type){const b=new Blob([text],{type});const f=new File([b],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).catch(()=>{});return;}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
function exportJSON(){download(`trainlog-backup-${ymd(new Date())}.json`,JSON.stringify(DB),'application/json');}
function exportCSV(){const rows=[['date','workout','type','exercise/item','set','set_type','kg','reps','rpe','e1rm','distance','time','pace_per_km','avg_hr','session_rpe','notes']];const qq=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  DB.sessions.forEach(s=>{const d=ymd(s.date);(s.exercises||[]).forEach(e=>e.sets.forEach((x,i)=>rows.push([d,s.name,s.type,e.name,i+1,x.kind==='W'?'warm-up':'working',x.kg,x.reps,x.rpe,e1rm(x.kg,x.reps).toFixed(1),'','','','',s.rpe,''])));
    if(s.run){rows.push([d,s.name,'run','Total','','','','','','',s.run.distKm+' km',s.run.time,s.run.pace?fmtTime(s.run.pace):'',s.run.avgHR,s.rpe,s.notes]);(s.run.reps||[]).forEach((x,i)=>x.time&&rows.push([d,s.name,'run','Rep',i+1,'','','','','',x.dist+' m',x.time,x.pace?fmtTime(x.pace):'',x.hr,'','']));}
    if(s.hyrox)for(const [k,b] of Object.entries(HYROX))s.hyrox.blocks[k].forEach((r,i)=>rows.push([d,s.name,'hyrox',b.name,i+1,'','','','','','',fmtTime(r.total),'','',s.rpe,'']));
    (s.cardio||[]).forEach(c=>rows.push([d,s.name,'cardio',c.machine,'','','','','','',c.dist?c.dist+' m':'',c.min,'',c.hr,s.rpe,s.notes]));});
  DB.bodyweight.forEach(b=>rows.push([b.date,'Body weight','body','','','',b.kg,'','','','','','','','','']));
  download(`trainlog-${ymd(new Date())}.csv`,rows.map(r=>r.map(qq).join(',')).join('\n'),'text/csv');}
function importJSON(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.templates||!d.sessions)throw 0;if(confirm(`Restore ${d.sessions.length} workouts? This replaces what's on this phone.`)){DB=migrate(d);save();go('home');toast('Backup restored');}}catch(e){alert('That file is not a valid TrainLog backup.');}};r.readAsText(file);}

/* ======================= GARMIN IMPORT (GPX / TCX) ======================= */
function importRunPick(){const i=document.createElement('input');i.type='file';i.accept='.gpx,.tcx,.xml,application/gpx+xml,application/xml,text/xml';i.onchange=()=>{const f=i.files[0];if(!f)return;if(/\.fit$/i.test(f.name))return alert('.FIT files aren\'t supported yet – export as TCX or GPX instead.');const r=new FileReader();r.onload=()=>{try{const a=parseActivity(r.result);importPreview(a);}catch(e){alert('Could not read that file: '+e.message);}};r.readAsText(f);};i.click();}
function hav(a,b){const R=6371000,t=Math.PI/180,dLa=(b[0]-a[0])*t,dLo=(b[1]-a[1])*t;const x=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function parseActivity(text){const doc=new DOMParser().parseFromString(text,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('not a valid XML file');
  const T=(el,n)=>el.getElementsByTagNameNS('*',n);const val=(el,n)=>{const x=T(el,n)[0];return x?x.textContent.trim():null;};let pts=[],totalSec=null,totalM=null;
  if(T(doc,'Trackpoint').length){[...T(doc,'Trackpoint')].forEach(tp=>{const t=val(tp,'Time'),d=val(tp,'DistanceMeters');const hr=T(tp,'HeartRateBpm')[0];pts.push({t:t?Date.parse(t):null,d:d!=null?+d:null,hr:hr?+val(hr,'Value'):null,lat:+val(tp,'LatitudeDegrees')||null,lon:+val(tp,'LongitudeDegrees')||null});});
    const laps=[...T(doc,'Lap')];if(laps.length){totalSec=laps.reduce((a,l)=>a+(+val(l,'TotalTimeSeconds')||0),0);totalM=laps.reduce((a,l)=>{const x=[...l.children].find(c=>c.localName==='DistanceMeters');return a+(x?+x.textContent:0);},0);}}
  else if(T(doc,'trkpt').length){[...T(doc,'trkpt')].forEach(p=>{const t=val(p,'time');const hr=val(p,'hr');pts.push({t:t?Date.parse(t):null,lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),hr:hr?+hr:null,d:null});});}
  else throw new Error('no track points found');
  pts=pts.filter(p=>p.t);if(pts.length<2)throw new Error('not enough data');
  if(pts.some(p=>p.d==null)){let cum=0;pts.forEach((p,i)=>{if(i&&p.lat&&pts[i-1].lat)cum+=hav([pts[i-1].lat,pts[i-1].lon],[p.lat,p.lon]);p.d=p.d??cum;});}
  const dist=totalM||pts[pts.length-1].d-pts[0].d;const sec=totalSec||(pts[pts.length-1].t-pts[0].t)/1000;
  const hrs=pts.map(p=>p.hr).filter(Boolean);const splits=[];let km=1,lastT=pts[0].t,hrAcc=[];
  pts.forEach(p=>{if(p.hr)hrAcc.push(p.hr);if(p.d-pts[0].d>=km*1000){splits.push({km,sec:Math.round((p.t-lastT)/1000),hr:hrAcc.length?Math.round(hrAcc.reduce((a,x)=>a+x,0)/hrAcc.length):null});lastT=p.t;hrAcc=[];km++;}});
  return {date:new Date(pts[0].t).toISOString(),distKm:+(dist/1000).toFixed(2),sec:Math.round(sec),avgHR:hrs.length?Math.round(hrs.reduce((a,x)=>a+x,0)/hrs.length):'',maxHR:hrs.length?Math.max(...hrs):'',splits};}
let IMP=null;
function importPreview(a){IMP=a;IMP.type=runOfWeek(new Date(a.date));const p=pace(a.sec,a.distKm);
  sheet(`<h3>Import run</h3><div class="mut sm">${fmtDate(a.date,{weekday:'long',day:'numeric',month:'long'})} · ${new Date(a.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
  <div class="stats s4" style="margin:12px 0"><div class="stat"><div class="v">${a.distKm}</div><div class="l">km</div></div><div class="stat"><div class="v">${fmtTime(a.sec)}</div><div class="l">time</div></div><div class="stat"><div class="v">${p?fmtTime(p):'–'}</div><div class="l">pace</div></div><div class="stat"><div class="v">${a.avgHR||'–'}</div><div class="l">avg HR</div></div></div>
  <label>What kind of run was it?</label><div class="seg" id="impSeg">${Object.entries(RUN_TYPES).map(([k,v])=>`<button class="${k===IMP.type?'on':''}" onclick="IMP.type='${k}';document.querySelectorAll('#impSeg button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith('${k==='F'?'Free':k}')))">${k==='F'?'Free':k+' · '+v.short}</button>`).join('')}</div>
  <button class="btn p block lg" onclick="importSave()">Save run</button>`);}
function importSave(){const a=IMP;const t=DB.templates.find(x=>x.type==='run');const col=t?t.color:TYPE_COL.run;
  const s={id:uid(),templateId:t?t.id:'run',name:'Run – '+RUN_TYPES[a.type].name,type:'run',color:col,date:a.date,start:+new Date(a.date),duration:a.sec,notes:'',rpe:null,imported:true,
    run:{type:a.type,distKm:String(a.distKm),time:fmtTime(a.sec),avgHR:a.avgHR,maxHR:a.maxHR,reps:[],splits:a.splits}};
  computeRun(s.run);s.pbs=findPBs(s);DB.sessions.push(s);save();closeSheet();go('summary',s.id,false);toast('Run imported ⌚');}

/* ======================= BOOT ======================= */
applyTheme();
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
save();
if(DB.active){view='workout';}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
