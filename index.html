<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrainLog">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TrainLog</title>
<style>
:root{--bg:#0b0d12;--s1:#151922;--s2:#1e232e;--s3:#2a3140;--line:rgba(255,255,255,.07);--txt:#eef1f6;--mut:#8a93a6;--acc:#ff6b2c;--ok:#22c55e;--okbg:rgba(34,197,94,.15);--bad:#ef4444;--warn:#f59e0b;--glass:rgba(11,13,18,.82);--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#f2f3f7;--s1:#ffffff;--s2:#eef0f4;--s3:#dfe3ea;--line:rgba(15,20,30,.08);--txt:#11141a;--mut:#6a7286;--okbg:rgba(34,197,94,.14);--glass:rgba(242,243,247,.85);--shadow:0 8px 24px rgba(20,25,40,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(160px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
body.kp-open{padding-bottom:440px}
body.onb nav,body.onb #resume{display:none!important}
body.onb{padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
.num{font-variant-numeric:tabular-nums}
.hdr{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.hdr .t{flex:1;min-width:0}
.hdr h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font-size:13px;color:var(--mut);margin-top:1px}
.back{background:none;border:0;color:var(--acc);font-size:17px;font-weight:600;padding:4px 4px 4px 0}
.pbar{height:3px;background:var(--s2);border-radius:3px;margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--c,var(--acc));border-radius:3px;transition:width .3s}
main{padding:14px 16px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 0 6px;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.sec{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:20px 4px 8px;display:flex;align-items:center}
.sec:first-child{margin-top:4px}
.sec .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:16px;font-weight:700;margin:0 0 8px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}.center{text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--s2);border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:650;transition:transform .1s,opacity .1s}
.btn:active,.cell:active,.tick:active,.key:active,.li:active{transform:scale(.97);opacity:.85}
.btn.p{background:var(--acc);color:var(--onacc,#fff)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.danger{color:var(--bad)}
.btn.lg{padding:15px;font-size:16.5px;border-radius:14px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--s2);color:var(--mut);font-size:18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:20px;background:var(--s2);color:var(--mut);white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.dotc{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:7px 6px;border-radius:9px;font-weight:650;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--s1);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.s2{grid-template-columns:repeat(2,1fr)}.stats.s4{grid-template-columns:repeat(4,1fr)}
.stat{background:var(--s2);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat .v{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:11px;color:var(--mut);font-weight:600;margin-top:1px}
.stat .d{font-size:11px;font-weight:700;margin-top:2px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:2px}.li:first-child{padding-top:2px}
.chev{color:var(--mut);font-size:20px;opacity:.6}
input,select,textarea{background:var(--s2);color:var(--txt);border:1px solid transparent;border-radius:11px;padding:10px 11px;font-size:16px;width:100%;font-family:inherit;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.45}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin:10px 2px 4px}
.field-row{display:flex;gap:8px}.field-row>div{flex:1;min-width:0}
.hero{border-radius:22px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-50px;top:-60px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:40px;bottom:-80px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero h2{font-size:28px;margin:4px 0 6px;letter-spacing:-.02em}
.hero p{margin:0 0 14px;opacity:.85;font-size:14px}
.hero .btn{background:rgba(255,255,255,.95);color:#111}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .dl{font-size:11px;color:var(--mut);font-weight:700}
.week .dot{width:36px;height:36px;margin:5px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--mut)}
.week .dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--txt)}
.week .wl{font-size:10.5px;font-weight:800;margin-top:5px;letter-spacing:.02em;height:14px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:420px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--s2);display:block}
.heat i.f{background:transparent}
.heatm{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;font-size:10px;color:var(--mut);margin-bottom:4px;height:13px;overflow:visible;white-space:nowrap;max-width:420px}
.ex .exh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.exn{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.ex.collapsed{display:flex;align-items:center;gap:12px;padding:13px 16px}
.ck{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.note{background:rgba(245,158,11,.12);color:var(--warn);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600;margin:-4px 0 10px;white-space:pre-wrap}
.sugg{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.ssbox{border:1.5px dashed var(--c);border-radius:22px;padding:8px 8px 0;margin-bottom:12px;position:relative}
.ssbox>.card{margin-bottom:8px}
.sslabel{position:absolute;top:-10px;left:18px;background:var(--bg);color:var(--c);font-size:11px;font-weight:800;letter-spacing:.08em;padding:0 6px}
.sethead,.setrow{display:grid;grid-template-columns:30px 58px 1fr 1fr 42px;gap:6px;align-items:center}
.setrow.sub{margin-top:5px;padding-left:10px}
.setrow.sub .cell{height:36px;font-size:15px}
.cell.setno.p{color:#22d3ee;font-weight:800}
.tick.x{height:36px;font-size:14px;color:var(--mut)}
.restln{font-size:11.5px;color:var(--mut);text-align:right;padding:3px 4px 0;font-variant-numeric:tabular-nums}
.exbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.exbtns .btn{padding:7px 2px;font-size:13px}
.sethead{font-size:11px;color:var(--mut);font-weight:700;text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.sw{position:relative;border-radius:12px;overflow:hidden;margin-bottom:6px}
.sw .del{position:absolute;inset:0;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;font-size:14px;border-radius:12px}
.sw .fg{position:relative;background:var(--s1);transition:transform .22s ease}
.cell{height:42px;border:0;border-radius:11px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;padding:0;transition:background .2s}
.cell.ghost{color:var(--mut);font-weight:500;opacity:.75}
.cell.focus{box-shadow:inset 0 0 0 2px var(--acc)}
.cell.setno{background:transparent;font-size:14px;color:var(--mut)}
.cell.setno.w{color:var(--warn);font-weight:800}
.cell.setno.d{color:#a78bfa;font-weight:800}
.cell.setno.f{color:var(--bad);font-weight:800}
.setrow.drop{padding-left:14px}
.prev{font-size:12px;color:var(--mut);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.prev.pr{color:var(--warn);font-weight:800}
.setrow.done .cell:not(.setno){background:var(--okbg)}
.setrow.prflash{animation:prf 1.2s ease}
@keyframes prf{0%,40%{background:rgba(245,158,11,.35);border-radius:12px}100%{background:transparent}}
.tick{width:42px;height:42px;border:0;border-radius:11px;background:var(--s2);color:var(--mut);font-size:19px;font-weight:800}
.tick.on{background:var(--ok);color:#fff;animation:pop .28s ease}
@keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
#kp{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--s1);border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);padding:10px 12px calc(12px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility .24s;border-top:1px solid var(--line)}
#kp.open{transform:none;visibility:visible}
.kpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:50px;border:0;border-radius:14px;background:var(--s2);font-size:22px;font-weight:600}
.key.fn{font-size:15px;font-weight:700;color:var(--acc)}
.key.go{background:var(--acc);color:var(--onacc,#fff);font-size:16px;font-weight:700}
.kpdisp{font-size:40px;font-weight:800;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.plates{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:26px;margin-bottom:8px;font-size:12px;color:var(--mut)}
.plate{border-radius:5px;color:#fff;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
#rest{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;background:var(--s3);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:none}
#rest .bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 28%,transparent);transition:width .25s linear}
#rest .in{position:relative;display:flex;align-items:center;gap:8px;padding:10px 12px}
#rest .t{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:rgba(255,255,255,.1);border:0;border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
[data-theme=light] #rest button{background:rgba(0,0,0,.07)}
body.kp-open #rest{display:none!important}
#resume{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:24;border-radius:16px;padding:11px 14px;display:none;align-items:center;gap:10px;font-weight:700;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;background:var(--txt);color:var(--bg);border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;font-weight:650;font-size:14px;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;max-width:92vw;box-shadow:var(--shadow)}
#toast span{overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--acc);font-weight:800}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:fadebg .2s}
@keyframes fadebg{from{background:rgba(0,0,0,0)}}
.sheet{background:var(--s1);width:100%;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--s3);margin:2px auto 12px}
.menu button{display:block;width:100%;text-align:left;background:var(--s2);border:0;border-radius:12px;padding:13px 14px;margin-bottom:6px;font-weight:600;font-size:15.5px}
.menu button.danger{color:var(--bad)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{padding:10px 0;border-radius:10px;border:0;background:var(--s2);font-weight:700;font-size:14px}
.rpe button.on{background:var(--acc);color:var(--onacc,#fff)}
canvas{width:100%;height:190px;display:block}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty .ic{font-size:44px;margin-bottom:8px}
.empty b{display:block;color:var(--txt);font-size:17px;margin-bottom:4px}
.bars .b{display:grid;grid-template-columns:86px 1fr 30px;gap:8px;align-items:center;margin:7px 0;font-size:13.5px;font-weight:600}
.bars .tr{height:12px;border-radius:6px;background:var(--s2);position:relative;overflow:hidden}
.bars .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bars .tr .band{position:absolute;top:0;bottom:0;border-left:1px dashed var(--mut);border-right:1px dashed var(--mut);opacity:.5;background:rgba(127,127,127,.08)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:0}
.swatches button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--txt)}
.big-check{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;margin:4px auto 10px;animation:pop .5s ease}
.pb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.pb:last-child{border:0}
.pb .tr{font-size:22px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.zone{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.in-grid{display:grid;grid-template-columns:26px 1fr 1fr 64px 62px;gap:6px;align-items:center;margin-bottom:6px}
.in-grid input{text-align:center;padding:9px 4px}
.hxnow{background:var(--s2);border-radius:16px;padding:14px;margin:8px 0}
.hxnow .big{font-size:44px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.delta{font-weight:800;font-variant-numeric:tabular-nums}
.delta.g{color:var(--ok)}.delta.r{color:var(--bad)}
.splitchips{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.tpl-ex{background:var(--s2);border-radius:14px;padding:10px;margin-bottom:0}
.tpl-ex input{background:var(--s1)}
.link{display:flex;justify-content:center;margin:4px 0}
.link button{border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px}
.link button.on{color:var(--c);background:var(--s2)}
.stgrid{display:grid;grid-template-columns:1fr 66px 66px 66px;gap:6px;align-items:center;margin-bottom:6px}
.stgrid input{text-align:center;padding:8px 2px;background:var(--s2)}
.setico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--s3);transition:all .2s}
.dots i.on{width:22px;background:var(--acc)}
.onb-hero{text-align:center;padding:26px 10px 10px}
.onb-hero .ic{width:84px;height:84px;border-radius:24px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(135deg,#ff7a3d,#d63e10);box-shadow:var(--shadow)}
.onb-hero h2{font-size:26px;margin-bottom:6px}
.event{display:flex;align-items:center;gap:14px}
.event .n{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}

[data-theme=midnight]{--bg:#000;--s1:#0d0e12;--s2:#18191f;--s3:#262832;--line:rgba(255,255,255,.08);--glass:rgba(0,0,0,.82)}
body.race{--bg:#000;--s1:#0f0f0f;--s2:#1b1b1b;--s3:#2a2a2a;--acc:#ffd400;--onacc:#111;--glass:rgba(0,0,0,.85);background:#000}
body.race .hxnow{background:#141414;border:1.5px solid #ffd400}
body.race .hxnow .big{font-size:60px;color:#ffd400}
body.race .hdr h1:before{content:"🏁 ";}
.goal{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .c b{font-size:22px;font-weight:800}
.ringfg{animation:ringin .9s cubic-bezier(.2,.8,.2,1)}
@keyframes ringin{from{stroke-dashoffset:var(--c0)}}
.flame{font-size:24px;filter:grayscale(1);opacity:.4}
.flame.on{filter:none;opacity:1;animation:flick 1.6s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.12) rotate(4deg)}}
.beat{padding:12px 14px}
.beat .tr{height:10px;border-radius:5px;background:var(--s2);position:relative;overflow:hidden}
.beat .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--acc);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.beat.ahead .tr i{background:linear-gradient(90deg,var(--acc),var(--ok))}
.beat.ahead{box-shadow:inset 0 0 0 1.5px var(--ok)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.badge{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;text-align:center;min-width:0}
.badge .i{font-size:32px;line-height:1.1}
.badge .n{font-size:12.5px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge .d{font-size:10.5px;color:var(--mut);margin-top:1px}
.badge.lock .i{filter:grayscale(1);opacity:.3}
.badge.lock .n{color:var(--mut)}
.badge:not(.lock){box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--acc) 45%,transparent)}
.pt{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin:6px 8px 0}
.pt i{display:block;height:100%;background:var(--acc);border-radius:3px}
.card .pt{margin:6px 0 0}
.newbadge{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.newbadge:last-child{border:0}
.newbadge .i{font-size:34px;animation:pop .6s ease}
.mmap{display:flex;justify-content:center;gap:10px}
.mmap>div{width:46%;max-width:170px}
.mmap.small>div{max-width:110px}
.mmap svg{width:100%;height:auto;display:block}
.mm{transition:fill .4s;cursor:pointer}
.mm.hot{filter:drop-shadow(0 0 3px var(--acc))}
.mleg{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);font-weight:600;margin-top:10px}
.mleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.gym-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card.gym{padding:18px}
.gym-name{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.gym-dots{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.gym-dots span{min-width:36px;height:36px;padding:0 6px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--s2);color:var(--mut)}
.gym-dots span.w{color:var(--warn)}
.gym-dots span.done{background:var(--ok);color:#fff}
.gym-dots span.cur{box-shadow:inset 0 0 0 2.5px var(--acc);color:var(--txt);transform:scale(1.08)}
.gym-io{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gym-io .lbl{text-align:center;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.gym-io .cell{height:92px;font-size:46px;font-weight:800;border-radius:20px;letter-spacing:-.02em}
.gym-pm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.gym-pm button{height:50px;border:0;border-radius:14px;background:var(--s2);font-size:18px;font-weight:800;color:var(--acc)}
.gym-pm button:active,.gym-go:active{transform:scale(.96)}
.gym-go{display:block;height:74px;font-size:22px;font-weight:800;border-radius:20px;width:100%;border:0;background:var(--ok);color:#fff;margin-top:16px;box-shadow:0 8px 22px color-mix(in srgb,var(--ok) 35%,transparent);transition:transform .1s}
.fun{font-size:15px;line-height:1.45}
.tgl{width:52px;height:32px;border-radius:16px;border:0;background:var(--s3);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:left .2s}
.tgl.on{background:var(--ok)}.tgl.on i{left:23px}
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<main id="app"></main>
<div id="rest"><div class="bar" id="restBar"></div><div class="in"><span class="mut sm" style="font-weight:700">REST</span><span class="t" id="restT">0:00</span><button onclick="Timer.add(-15)">−15</button><button onclick="Timer.add(15)">+15</button><button onclick="Timer.stop()">Skip</button></div></div>
<div id="resume"></div>
<div id="toast"></div>
<div id="kp"></div>
<nav>
 <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</button>
 <button data-v="history"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>History</button>
 <button data-v="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4.5-5 4 3L20 6"/></svg>Progress</button>
 <button data-v="templates"><svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Workouts</button>
 <button data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>Settings</button>
</nav>
<script>
/* ======================= CORE / UTILS ======================= */
const APP_VERSION='2.3';
const KEY='trainlog_v1'; // same storage key since v1 so data carries over
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=v=>esc(JSON.stringify(v));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
function ymd(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toDate(d){return (typeof d==='string'&&/^\d{4}-\d\d-\d\d$/.test(d))?new Date(d+'T00:00:00'):new Date(d);}
function mondayOf(d){d=toDate(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function addDays(d,n){d=new Date(d);d.setDate(d.getDate()+n);return d;}
function fmtTime(sec){if(sec==null||isNaN(sec))return '–';sec=Math.round(sec);const neg=sec<0;sec=Math.abs(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (neg?'-':'')+(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0');}
function parseTime(str){if(str==null)return null;str=String(str).trim();if(!str)return null;const p=str.split(':').map(Number);if(p.some(isNaN))return null;let s=0;for(const x of p)s=s*60+x;return s;}
// iPhone number pad has no colon: "400" -> "4:00", "2000" -> "20:00", "13045" -> "1:30:45"
function digitsToTime(v){if(String(v).includes(':'))return String(v).trim();let d=String(v||'').replace(/\D/g,'').replace(/^0+/,'');if(!d)return '';if(d.length<=2)return '0:'+d.padStart(2,'0');const s=d.slice(-2),m=d.slice(-4,-2),h=d.slice(0,-4);return h?h+':'+m.padStart(2,'0')+':'+s:String(+m)+':'+s;}
function fmtKg(x){if(x===''||x==null||isNaN(+x))return '';return String(Math.round(+x*100)/100);}
function roundTo(x,step){return step?Math.round(Math.round(x/step)*step*100)/100:Math.round(x*100)/100;}
function e1rm(kg,reps){kg=+kg;reps=+reps;if(!kg||!reps)return 0;return reps===1?kg:kg*(1+reps/30);}
function pace(sec,km){return sec&&km?sec/km:null;}
function fmtPace(p){return p?fmtTime(p)+'/km':'–';}
function fmtDate(d,o={weekday:'short',day:'numeric',month:'short'}){return toDate(d).toLocaleDateString('en-GB',o);}
function fmtDur(sec){if(!sec)return '–';const m=Math.round(sec/60);return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min';}
function onColor(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>170?'#14161b':'#fff';}
function shade(hex,p){const n=parseInt(hex.slice(1),16);const f=c=>Math.round(c*(1+p/100));return '#'+[n>>16,n>>8&255,n&255].map(c=>Math.max(0,Math.min(255,f(c))).toString(16).padStart(2,'0')).join('');}
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}

/* ======================= DATA ======================= */
const PALETTE=['#ff6b2c','#3d9bff','#ffc233','#34d399','#a78bfa','#f472b6','#22d3ee','#ef4444'];
const TYPE_COL={strength:'#ff6b2c',run:'#a78bfa',hyrox:'#ffc233',cardio:'#34d399'};
const ex=(name,sets=2,rest=90)=>({name,sets,reps:'',rest,group:null});
/* Hyrox station library – unit: m (metres), reps, steps, s (time) */
const STATIONS={
 run:{name:'Run',unit:'m',def:1000},
 ski:{name:'Ski erg',unit:'m',def:250},
 row:{name:'Row',unit:'m',def:250},
 bike:{name:'Bike',unit:'s',def:60},
 sledpush:{name:'Sled push',unit:'m',def:20,kg:true},
 sledpull:{name:'Sled pull',unit:'m',def:20,kg:true},
 bbj:{name:'Burpee broad jumps',unit:'m',def:20},
 farmers:{name:'Farmers carry',unit:'m',def:50,kg:true},
 sandbag:{name:'Sandbag lunges',unit:'m',def:25,kg:true},
 lunges:{name:'Lunges',unit:'steps',def:20},
 wallballs:{name:'Wall balls',unit:'reps',def:20,kg:true}
};
const st=(sid,amount,target=null)=>({sid,amount,target});
const HX_FRIDAY=[
 {name:'Pre-fatigue',rounds:4,rest:120,stations:[st('bike',60),st('ski',250),st('row',250)]},
 {name:'Legs on tired legs',rounds:3,rest:90,stations:[st('sledpush',20),st('lunges',20),st('wallballs',20)]},
 {name:'Finisher',rounds:1,rest:0,stations:[st('lunges',20),st('wallballs',30)]}];
const RACE_ORDER=[['ski',1000],['sledpush',50],['sledpull',50],['bbj',80],['row',1000],['farmers',200],['sandbag',100],['wallballs',100]];
const HX_TEMPLATES=[
 {id:'hx_race',name:'Hyrox race sim',type:'hyrox',day:'',color:'#f59e0b',short:'RS',exercises:[],blocks:[{name:'Full race',rounds:1,rest:0,stations:RACE_ORDER.flatMap(([s,a])=>[st('run',1000),st(s,a)])}]},
 {id:'hx_half',name:'Hyrox half sim',type:'hyrox',day:'',color:'#f472b6',short:'HS',exercises:[],blocks:[{name:'Half race',rounds:1,rest:0,stations:[['ski',1000],['sledpush',50],['row',1000],['wallballs',50]].flatMap(([s,a])=>[st('run',1000),st(s,a)])}]},
 {id:'hx_focus',name:'Hyrox station focus',type:'hyrox',day:'',color:'#22d3ee',short:'SF',exercises:[],blocks:[{name:'Sleds',rounds:4,rest:90,stations:[st('sledpush',25),st('sledpull',25)]},{name:'Carry & lunge',rounds:3,rest:90,stations:[st('farmers',100),st('sandbag',50)]},{name:'Burpees + wall balls',rounds:2,rest:120,stations:[st('bbj',40),st('wallballs',30)]}]}];
const DEFAULT_TEMPLATES=[
 {id:'push',name:'Push',type:'strength',day:1,color:'#ff6b2c',short:'Pu',exercises:[ex('Incline Smith press',2,120),ex('Flat DB press',2,120),ex('Overhead press',2,120),ex('Cable flies',2,75),ex('Cable laterals',2,60),ex('Tricep extensions',2,60)]},
 {id:'run',name:'Run',type:'run',day:2,color:'#a78bfa',short:'Ru',exercises:[]},
 {id:'pull',name:'Pull',type:'strength',day:3,color:'#3d9bff',short:'Pl',exercises:[ex('Pull-ups / lat pulldown',2,120),ex('Row',2,120),ex('Single-arm pulldown / lat pullover',2,75),ex('Lower back',2,75),ex('Bayesian curl',2,60),ex('Hammer curls',2,60),ex('Preacher / spider curls',2,60)]},
 {id:'hyrox',name:'Legs + Hyrox',type:'hyrox',day:5,color:'#ffc233',short:'Hx',exercises:[],blocks:HX_FRIDAY},
 {id:'cardio',name:'Cardio',type:'cardio',day:6,color:'#34d399',short:'Ca',exercises:[]},
 ...HX_TEMPLATES];
const RUN_TYPES={
 A:{name:'Norwegian 4×4',short:'4×4',desc:'4 min hard (~90–95% max HR), 3 min easy jog',mode:'intervals',reps:4,hr:[90,95]},
 B:{name:'Long easy run',short:'Long',desc:'40–60 min, conversational pace',mode:'continuous',hr:[60,75]},
 C:{name:'Speed build',short:'Speed',desc:'6–8 × 200–400 m, full recovery',mode:'intervals',reps:6},
 F:{name:'Free run',short:'Free',desc:'Any other run',mode:'continuous'}
};
const ZONES=[[50,60,'Z1 Recovery','#94a3b8'],[60,70,'Z2 Easy','#3d9bff'],[70,80,'Z3 Tempo','#34d399'],[80,90,'Z4 Threshold','#ffc233'],[90,101,'Z5 Max','#ef4444']];
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Lower back','Other'];
const EQUIP={db:'Dumbbell',smith:'Smith machine',barbell:'Barbell',cable:'Cable / machine',bw:'Bodyweight'};
const MUSCLE_RULES=[[/lower back|back ext|hyperext|good morning/i,'Lower back'],[/leg curl|hamstring|rdl|romanian|stiff/i,'Hamstrings'],[/leg ext|squat|leg press|lunge|hack|wall ball|step.?up/i,'Quads'],[/hip thrust|glute|kickback/i,'Glutes'],[/calf|calves/i,'Calves'],[/tricep|pushdown|skull|close.?grip|dip/i,'Triceps'],[/curl/i,'Biceps'],[/overhead|shoulder press|ohp|military|lateral|raise|rear delt|face pull|arnold/i,'Shoulders'],[/pull.?up|chin|pulldown|pullover|row|\blat\b|shrug|deadlift/i,'Back'],[/press|fly|flies|chest|bench|pec|push.?up/i,'Chest'],[/plank|crunch|\babs?\b|core|leg raise|sit.?up|rollout/i,'Core']];
const EQUIP_RULES=[[/smith/i,'smith'],[/\bdb\b|dumbbell|hammer|preacher|spider|lunge/i,'db'],[/cable|pulldown|pullover|pushdown|machine|bayesian|row|fly|flies|lateral|extension|face pull|leg press|leg curl/i,'cable'],[/pull.?up|chin|dip|push.?up|plank|lower back|back ext|hyperext/i,'bw'],[/barbell|bench|deadlift|squat|ohp|overhead press|military|rdl/i,'barbell']];

let DB=load();
function freshDB(){return {templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES)),sessions:[],active:null,settings:{}};}
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}if(!d||!d.templates)d=freshDB();return migrate(d);}
function migrate(d){
  d.settings=Object.assign({startDate:ymd(mondayOf(new Date())),runRotation:['A','B','C'],deloadEvery:5,defaultRest:90,maxHR:'',theme:'auto',weeklyGoal:4,dbStep:2,machineStep:2.5,plates:[25,20,15,10,5,2.5,1.25],barKg:20,smithBarKg:20,event:{name:'',date:''},setupDone:false,restMode:'off',accent:'#ff6b2c',raceMode:true,haptics:true,name:'Toby'},d.settings||{});
  if(!d.settings.event)d.settings.event={name:'',date:''};
  d.sessions=d.sessions||[];d.bodyweight=d.bodyweight||[];d.exMeta=d.exMeta||{};d.customStations=d.customStations||{};
  const oldT=d.hyroxTargets||{};
  const col={push:'#ff6b2c',run:'#a78bfa',pull:'#3d9bff',hyrox:'#ffc233',cardio:'#34d399'},sh={push:'Pu',run:'Ru',pull:'Pl',hyrox:'Hx',cardio:'Ca'};
  d.templates.forEach(t=>{if(!t.color)t.color=col[t.id]||TYPE_COL[t.type]||'#ff6b2c';if(!t.short)t.short=sh[t.id]||t.name.slice(0,2);t.exercises=t.exercises||[];t.exercises.forEach(e=>{if(e.group===undefined)e.group=null;});
    if(t.type==='hyrox'&&!t.blocks){t.blocks=JSON.parse(JSON.stringify(HX_FRIDAY));const keys=['pre','legs','fin'];t.blocks.forEach((b,bi)=>b.stations.forEach((x,i)=>{const v=oldT[keys[bi]+':'+i];if(v)x.target=v;}));}});
  if(!d.hxTemplatesAdded){HX_TEMPLATES.forEach(t=>{if(!d.templates.some(x=>x.id===t.id))d.templates.push(JSON.parse(JSON.stringify(t)));});d.hxTemplatesAdded=true;}
  delete d.hyroxTargets;
  const OLD=[['pre',4,120,'Pre-fatigue',[['bike',60],['ski',250],['row',250]]],['legs',3,90,'Legs on tired legs',[['sledpush',20],['lunges',20],['wallballs',20]]],['fin',1,0,'Finisher',[['lunges',20],['wallballs',30]]]];
  const fix=s=>{if(!s)return;if(!s.color){const t=d.templates.find(x=>x.id===s.templateId);s.color=t?t.color:(TYPE_COL[s.type]||'#ff6b2c');}
    (s.exercises||[]).forEach(e=>{if(e.group===undefined)e.group=null;e.sets.forEach(x=>{if(!x.kind)x.kind='N';});});
    if(s.hyrox&&!Array.isArray(s.hyrox.blocks)){const H=s.hyrox;s.hyrox={loads:{sledpush:H.sledKg||'',wallballs:H.wallBallKg||''},blocks:OLD.map(([k,r,rest,name,sts])=>({name,rounds:r,rest,stations:sts.map(([sid,a])=>st(sid,a)),results:(H.blocks&&H.blocks[k])||Array.from({length:r},()=>({splits:sts.map(()=>null),total:null}))}))};}};
  d.sessions.forEach(fix);fix(d.active);
  // v2.2: 2 sets per exercise in every strength template (one-off)
  if(!d.v22){d.templates.forEach(t=>{if(t.type==='strength')t.exercises.forEach(e=>{e.sets=2;});});d.settings.restMode=d.settings.restMode||'off';d.v22=true;}
  d.version=2.3;return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){toast('⚠️ Could not save – storage full?');}}

/* programme helpers */
function weekNo(date=new Date()){return Math.floor((mondayOf(date)-mondayOf(DB.settings.startDate))/(7*864e5))+1;}
function isDeload(date=new Date()){const n=+DB.settings.deloadEvery||5;const w=weekNo(date);return w>0&&w%n===0;}
function runOfWeek(date=new Date()){const r=DB.settings.runRotation;return r[(Math.max(1,weekNo(date))-1)%r.length];}
function tShort(t){return t.short||t.name.slice(0,2);}
function eventInfo(){const e=DB.settings.event;if(!e||!e.date)return null;const days=Math.round((toDate(e.date)-toDate(ymd(new Date())))/864e5);if(days<0)return null;return {name:e.name||'Event',date:e.date,days,weeks:Math.ceil(days/7)};}

/* stations */
function station(sid){return STATIONS[sid]||DB.customStations[sid]||{name:sid,unit:'reps',def:10};}
function amtTxt(x){const S=station(x.sid);return S.unit==='s'?fmtTime(x.amount):x.amount+(S.unit==='m'?' m':' '+S.unit);}
function stLabel(x){return station(x.sid).name+' '+amtTxt(x);}
function stShort(x){const S=station(x.sid);return S.name.length>10?S.name.split(' ').map(w=>w[0]).join('').toUpperCase():S.name;}
function stationBests(list){const b={};list.filter(o=>o.hyrox).forEach(o=>o.hyrox.blocks.forEach(bl=>bl.results.forEach(r=>bl.stations.forEach((x,i)=>{const v=r.splits[i];if(v==null)return;const k=x.sid+':'+x.amount;if(b[k]==null||v<b[k])b[k]=v;}))));return b;}

/* exercise meta: muscle, equipment, sticky note */
function guess(rules,name,def){for(const [re,v] of rules)if(re.test(name))return v;return def;}
function meta(name){const m=DB.exMeta[(name||'').toLowerCase()]||{};return {muscle:m.muscle||guess(MUSCLE_RULES,name,'Other'),equip:m.equip||guess(EQUIP_RULES,name,'cable'),note:m.note||''};}
function setMeta(name,k,v){const key=name.toLowerCase();DB.exMeta[key]=Object.assign({},DB.exMeta[key],{[k]:v});save();}
function stepFor(name){const S=DB.settings,e=meta(name).equip;if(e==='db')return +S.dbStep||2;if(e==='smith'||e==='barbell')return 2*Math.min(...(S.plates.length?S.plates:[1.25]));if(e==='bw')return 0;return +S.machineStep||2.5;}
function barFor(name){const e=meta(name).equip;return e==='smith'?+DB.settings.smithBarKg||0:e==='barbell'?+DB.settings.barKg||0:null;}
function plateList(total,bar){const plates=[...DB.settings.plates].sort((a,b)=>b-a);let side=(total-bar)/2;if(side<-0.001)return null;const out=[];for(const p of plates){while(side>=p-0.001){out.push(p);side-=p;}}return {plates:out,rem:Math.round(side*100)/100};}
const PLATE_COL={25:'#ef4444',20:'#3d9bff',15:'#f59e0b',10:'#22c55e',5:'#64748b',2.5:'#a78bfa',1.25:'#94a3b8'};

/* set kinds: N normal, W warm-up (not counted), D drop (counts to volume, not PRs), F failure (counts) */
const working=e=>e.sets.filter(x=>x.done&&x.kind!=='W'&&+x.reps>0);
const prSets=e=>e.sets.filter(x=>x.done&&(x.kind==='N'||x.kind==='F')&&+x.reps>0);
const exVol=e=>working(e).reduce((a,x)=>a+(+x.kg||0)*(+x.reps||0)+(x.drops||[]).reduce((b,d)=>b+(+d.kg||0)*(+d.reps||0),0),0);
function sortedSessions(){return [...DB.sessions].sort((a,b)=>b.date.localeCompare(a.date));}
function lastExercise(name){const n=name.toLowerCase();for(const s of sortedSessions()){const e=(s.exercises||[]).find(x=>x.name.toLowerCase()===n);if(e&&e.sets.some(x=>x.done))return e;}return null;}
function exHistory(name){const n=name.toLowerCase();return [...DB.sessions].sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{const e=(s.exercises||[]).find(x=>x.name.toLowerCase()===n);if(!e)return null;const w=prSets(e);if(!w.length)return null;const top=w.reduce((a,x)=>+x.kg>+a.kg?x:a,w[0]);return {s,e,w,all:working(e),date:s.date,e1:Math.max(...w.map(x=>e1rm(x.kg,x.reps))),top:+top.kg||0,topR:+top.reps,vol:exVol(e)};}).filter(Boolean);}
function rangeOf(t){const m=String(t||'').match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return [+m[1],+m[2]];const n=parseInt(t);return n?[n,n]:[8,12];}

/* progressive overload suggestion */
function suggestFor(name,target,deload){
  const last=lastExercise(name);if(!last)return null;
  const ws=prSets(last);if(!ws.length)return null;
  const [lo,hi]=rangeOf(target);const step=stepFor(name);
  if(deload)return {label:'Deload',why:'Same weight, fewer sets this week',sets:ws.map(x=>({kg:x.kg,reps:x.reps}))};
  const top=Math.max(...ws.map(x=>+x.kg||0));const topSets=ws.filter(x=>(+x.kg||0)===top);
  const allHit=topSets.every(x=>+x.reps>=hi);
  if(allHit&&step>0){const nk=roundTo(top+step,step);return {label:'↑ '+fmtKg(nk)+' kg',why:`Hit ${hi} reps on every set last time`,sets:ws.map(()=>({kg:nk,reps:lo}))};}
  if(allHit)return {label:'+1 rep',why:'Top of range hit – add reps or load',sets:ws.map(x=>({kg:x.kg,reps:(+x.reps||0)+1}))};
  return {label:'+1 rep',why:`Same weight, aim for one more rep (up to ${hi})`,sets:ws.map(x=>({kg:x.kg,reps:Math.min(hi,(+x.reps||0)+1)}))};
}

/* metrics */
function sessVolume(s){return (s.exercises||[]).reduce((a,e)=>a+exVol(e),0);}
function sessSets(s){return (s.exercises||[]).reduce((a,e)=>a+working(e).length,0);}
function sessKm(s){let k=0;if(s.run)k+=+s.run.distKm||0;(s.cardio||[]).forEach(c=>{if(c.machine==='Run')k+=(+c.dist||0)/1000;});if(s.hyrox)s.hyrox.blocks.forEach(b=>b.results.forEach(r=>b.stations.forEach((x,i)=>{if(x.sid==='run'&&r.splits[i]!=null)k+=x.amount/1000;})));return k;}
function hyroxTotal(s){if(!s.hyrox)return null;let t=0;for(const b of s.hyrox.blocks){for(const r of b.results){if(r.total==null)return null;t+=r.total;}}return t||null;}
function zoneOf(hr){const m=+DB.settings.maxHR;if(!m||!hr)return null;const p=hr/m*100;return ZONES.find(z=>p>=z[0]&&p<z[1])||(p<50?null:ZONES[4]);}
function computeRun(r){const t=parseTime(r.time),d=+r.distKm;r.sec=t;r.pace=pace(t,d);r.speed=t&&d?d/(t/3600):null;(r.reps||[]).forEach(x=>{x.sec=parseTime(x.time);x.pace=pace(x.sec,(+x.dist)/1000);});}
/* race time estimate (Riegel) from best run ≥2 km in the 8 weeks before a date */
function raceEst(km,asOf=new Date(),weeks=8){const to=new Date(asOf),from=addDays(to,-7*weeks);let best=null,src=null;
  DB.sessions.forEach(s=>{if(!s.run)return;const d=new Date(s.date);if(d>to||d<from)return;const dk=+s.run.distKm,t=s.run.sec||parseTime(s.run.time);if(!dk||dk<2||!t)return;const p=t*Math.pow(km/dk,1.06);if(best==null||p<best){best=p;src=s;}});
  return best?{sec:best,src}:null;}
function summaryLine(s){
  if(s.type==='strength'){const v=sessVolume(s);return `${sessSets(s)} sets · ${Math.round(v).toLocaleString()} kg`;}
  if(s.run)return s.run.distKm?`${s.run.distKm} km · ${fmtPace(s.run.pace)}`:RUN_TYPES[s.run.type].name;
  if(s.hyrox){const t=hyroxTotal(s);return t?'Total '+fmtTime(t):'Hyrox circuit';}
  if(s.cardio)return s.cardio.map(c=>c.machine+(c.min?' '+c.min:'')).join(' · ');return '';
}
function findPBs(s){
  const pbs=[];const others=DB.sessions.filter(x=>x.id!==s.id&&x.date<s.date);
  (s.exercises||[]).forEach(e=>{const w=prSets(e);if(!w.length)return;const n=e.name.toLowerCase();
    const prevEx=others.flatMap(o=>(o.exercises||[]).filter(x=>x.name.toLowerCase()===n));const prevSets=prevEx.flatMap(prSets);if(!prevSets.length)return;
    const hk=Math.max(...w.map(x=>+x.kg||0)),pk=Math.max(...prevSets.map(x=>+x.kg||0));
    const best=Math.max(...w.map(x=>e1rm(x.kg,x.reps))),prev=Math.max(...prevSets.map(x=>e1rm(x.kg,x.reps)));
    if(hk>pk+0.01)pbs.push({name:e.name,what:'Heaviest weight',val:fmtKg(hk)+' kg',prev:fmtKg(pk)+' kg'});
    if(best>prev+0.05)pbs.push({name:e.name,what:'Best est. 1RM',val:best.toFixed(1)+' kg',prev:prev.toFixed(1)+' kg'});
    if(!(hk>pk+0.01)){const rb={};prevSets.forEach(x=>{const r=+x.reps;rb[r]=Math.max(rb[r]??0,+x.kg||0);});let rp=null;
      w.forEach(x=>{const r=+x.reps,k=+x.kg||0;if(rb[r]!=null&&k>rb[r]+0.01&&(!rp||k>rp.k))rp={k,r,was:rb[r]};});
      if(rp)pbs.push({name:e.name,what:rp.r+'-rep PR',val:fmtKg(rp.k)+' kg',prev:fmtKg(rp.was)+' kg'});}
    const v=exVol(e),pv=Math.max(...prevEx.map(exVol));if(v>pv+0.01&&pv>0)pbs.push({name:e.name,what:'Best session volume',val:Math.round(v).toLocaleString()+' kg',prev:Math.round(pv).toLocaleString()+' kg'});});
  if(s.run){const r=s.run;const prev=others.filter(o=>o.run);
    const pp=prev.filter(o=>o.run.type===r.type&&o.run.pace).map(o=>o.run.pace);if(r.pace&&pp.length&&r.pace<Math.min(...pp))pbs.push({name:RUN_TYPES[r.type].name,what:'Fastest pace',val:fmtPace(r.pace),prev:fmtPace(Math.min(...pp))});
    const dd=prev.map(o=>+o.run.distKm||0);if(+r.distKm&&dd.length&&+r.distKm>Math.max(...dd))pbs.push({name:'Running',what:'Longest run',val:r.distKm+' km',prev:Math.max(...dd)+' km'});
    const e5=raceEst(5,new Date(s.date)),p5=raceEst(5,new Date(new Date(s.date).getTime()-1000));if(e5&&p5&&e5.src.id===s.id&&e5.sec<p5.sec-1)pbs.push({name:'Estimated 5K',what:'Faster prediction',val:fmtTime(e5.sec),prev:fmtTime(p5.sec)});}
  if(s.hyrox){const t=hyroxTotal(s),pv=others.filter(o=>o.hyrox&&o.templateId===s.templateId).map(hyroxTotal).filter(Boolean);if(t&&pv.length&&t<Math.min(...pv))pbs.push({name:s.name,what:'Fastest total',val:fmtTime(t),prev:fmtTime(Math.min(...pv))});
    const best=stationBests(others),seen={};s.hyrox.blocks.forEach(b=>b.results.forEach(r=>b.stations.forEach((x,i)=>{const v=r.splits[i];if(v==null)return;const k=x.sid+':'+x.amount;if(best[k]!=null&&v<best[k]&&(seen[k]==null||v<seen[k]))seen[k]=v;})));
    Object.entries(seen).forEach(([k,v])=>{const [sid,a]=k.split(':');pbs.push({name:stLabel({sid,amount:+a}),what:'Fastest split',val:fmtTime(v),prev:fmtTime(best[k])});});}
  return pbs;
}

let toastT;
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;t.classList.add('show');if(undo)t.querySelector('button').onclick=()=>{undo();t.classList.remove('show');};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),undo?5000:2600);}
function sheet(html){closeSheet();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;m.onclick=e=>{if(e.target===m)closeSheet();};document.body.appendChild(m);}
function closeSheet(){const m=$('#modal');if(m)m.remove();}
function spark(vals,col,w=70,h=26){vals=vals.filter(v=>v!=null&&!isNaN(v));if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>[2+i/(vals.length-1)*(w-4),h-3-(v-mn)/r*(h-6)]);const last=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.8" fill="${col}"/></svg>`;}
function emptyState(icon,title,text,btn=''){return `<div class="empty"><div class="ic">${icon}</div><b>${title}</b><div class="sm">${text}</div>${btn?`<div style="margin-top:14px">${btn}</div>`:''}</div>`;}
function confetti(n=60){const c=document.createElement('div');c.className='confetti';for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=PALETTE[i%PALETTE.length];e.style.animationDelay=Math.random()*.6+'s';e.style.animationDuration=1.6+Math.random()*1.2+'s';c.appendChild(e);}document.body.appendChild(c);setTimeout(()=>c.remove(),3500);}
let actx;function audioUnlock(){try{if(!actx){actx=new (window.AudioContext||window.webkitAudioContext)();}if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(n=2,f=880){try{audioUnlock();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=f;const t=actx.currentTime+i*.25;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21);}}catch(e){}}
document.addEventListener('touchstart',audioUnlock,{once:true,passive:true});

/* swipe-left-to-delete */
function attachSwipe(el,cb){let x0,y0,dx=0,drag=null;const fg=el.querySelector('.fg');
  el.addEventListener('click',e=>{if(el._block){e.stopPropagation();e.preventDefault();el._block=false;}},true);
  el.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;drag=null;fg.style.transition='none';},{passive:true});
  el.addEventListener('touchmove',e=>{const mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;if(drag===null&&(Math.abs(mx)>8||Math.abs(my)>8))drag=Math.abs(mx)>Math.abs(my)&&mx<0;if(drag){dx=Math.min(0,mx);fg.style.transform=`translateX(${dx}px)`;}},{passive:true});
  el.addEventListener('touchend',()=>{fg.style.transition='';if(drag){el._block=true;setTimeout(()=>el._block=false,350);}if(drag&&dx<-90){fg.style.transform='translateX(-110%)';haptic();setTimeout(cb,200);}else fg.style.transform='';});}

/* rest timer – timestamp based so it survives locking the phone */
const Timer={int:null,
  start(sec){if(!DB.active)return;DB.active.restEnd=Date.now()+sec*1000;DB.active.restDur=sec;save();this.run();},
  run(){$('#rest').style.display='block';clearInterval(this.int);this.int=setInterval(()=>this.tick(),200);this.tick();},
  add(s){if(!DB.active||!DB.active.restEnd)return;DB.active.restEnd+=s*1000;DB.active.restDur=Math.max(1,DB.active.restDur+s);save();this.tick();},
  stop(){clearInterval(this.int);$('#rest').style.display='none';if(DB.active){DB.active.restEnd=null;save();}},
  tick(){const a=DB.active;if(!a||!a.restEnd)return this.stop();const r=(a.restEnd-Date.now())/1000;if(r<=0){this.stop();beep(3);haptic();toast('Rest over – next set 💪');return;}
    $('#restT').textContent=fmtTime(Math.ceil(r));$('#restBar').style.width=(r/a.restDur*100)+'%';}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(DB.active&&DB.active.restEnd)Timer.run();tickClocks();}});

let view='home',param=null,stack=[];
const TABS=['home','history','progress','templates','settings'];
function go(v,p=null,push=true){if(push&&!TABS.includes(v))stack.push({v:view,p:param});if(TABS.includes(v))stack=[];view=v;param=p;closeSheet();closeKp();render();window.scrollTo(0,0);}
function back(){const b=stack.pop()||{v:'home',p:null};view=b.v;param=b.p;render();window.scrollTo(0,0);}
function setHeader(title,{sub='',right='',backBtn=false,extra=''}={}){
  $('#hdr').innerHTML=`${backBtn?`<button class="back" onclick="back()">‹ Back</button>`:''}<div class="t"><h1>${esc(title)}</h1>${sub?`<div class="sub">${sub}</div>`:''}${extra}</div>${right}`;}
function render(){
  document.body.classList.toggle('onb',view==='setup');
  document.body.classList.toggle('race',view==='workout'&&!!DB.active&&DB.active.type==='hyrox'&&DB.settings.raceMode!==false);
  const navV=view==='workout'||view==='summary'?'home':view==='exercise'?'progress':view==='session'?'history':view==='editTemplate'?'templates':view==='settingsSec'?'settings':view;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===navV));
  ({home:renderHome,history:renderHistory,progress:renderProgress,templates:renderTemplates,editTemplate:renderEditTemplate,settings:renderSettings,settingsSec:renderSettingsSec,setup:renderSetup,workout:renderWorkout,session:()=>renderSessionView(false),summary:()=>renderSessionView(true),exercise:renderExercise}[view]||renderHome)();
  updateResume();
}
function updateResume(){const r=$('#resume'),a=DB.active;if(a&&view!=='workout'&&view!=='setup'){r.style.display='flex';r.style.background=a.color;r.style.color=onColor(a.color);r.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:currentColor;animation:fade 1s infinite alternate"></span><span class="grow ell">${esc(a.name)} · <span id="resumeT" class="num"></span></span><span>Resume ›</span>`;r.onclick=()=>go('workout');tickClocks();}else r.style.display='none';}
function tickClocks(){const a=DB.active;if(!a)return;const t=fmtTime((Date.now()-a.start)/1000);const c=$('#clock'),r=$('#resumeT');if(c)c.textContent=t;if(r)r.textContent=t;}
setInterval(tickClocks,1000);

function weekCount(mon){const end=addDays(mon,7);return DB.sessions.filter(s=>{const d=new Date(s.date);return d>=mon&&d<end;}).length;}
function streak(){const g=+DB.settings.weeklyGoal||4;let mon=mondayOf(new Date()),n=0;if(weekCount(mon)>=g)n++;mon=addDays(mon,-7);while(weekCount(mon)>=g){n++;mon=addDays(mon,-7);}return n;}
function planDesc(t,date=new Date()){
  if(t.type==='strength')return t.exercises.length?t.exercises.map(e=>e.name).slice(0,4).join(' · ')+(t.exercises.length>4?` +${t.exercises.length-4}`:''):'Build it as you go';
  if(t.type==='run'){const rt=runOfWeek(date);return `${RUN_TYPES[rt].name} — ${RUN_TYPES[rt].desc}`;}
  if(t.type==='hyrox')return (t.blocks||[]).map(b=>b.name+(b.rounds>1?' ×'+b.rounds:'')).join(' → ')||'No stations yet';
  return 'Steady state 30–40 min · bike / row / ski erg';}
function renderHome(){

  else if(next)h+=`<div class="hero" style="${heroBg(next.color)}"><div class="k">Today${dl?' · Deload week':''}</div><h2>${esc(next.name)}</h2><p>${esc(planDesc(next))}</p><button class="btn lg block" onclick="startSession(${q(next.id)})">Start ${esc(next.name)}</button></div>`;
  else if(planned.length)h+=`<div class="hero" style="${heroBg('#22c55e')}"><div class="k">Today</div><h2>Done for today ✓</h2><p>${doneToday.map(s=>esc(s.name)).join(' · ')}</p><button class="btn lg block" onclick="go('session',${q(doneToday[doneToday.length-1].id)})">View workout</button></div>`;
  else h+=`<div class="hero" style="background:linear-gradient(135deg,#475569,#1e293b);color:#fff"><div class="k">Today</div><h2>Rest day 😴</h2><p>${dayPick(MOTTO)}</p><button class="btn lg block" onclick="pickWorkout()">Start a workout anyway</button></div>`;
  if(!DB.active&&planned.length)h+=`<button class="btn ghost block" style="margin:-4px 0 4px" onclick="pickWorkout()">Start a different workout</button>`;

  if(now.getDate()<=7&&pmN)h+=`<div class="card li" style="padding:14px 16px" onclick="progTab='report';repOff=-1;go('progress')"><div class="setico" style="background:rgba(61,155,255,.15)">📊</div><div class="grow"><b>Your ${pm.toLocaleDateString('en-GB',{month:'long'})} report</b><div class="mut sm">${pmN} workouts · see what improved</div></div><span class="chev">›</span></div>`;

function weekStrip(mon){const today=ymd(new Date());let h='<div class="week">';
  for(let i=0;i<7;i++){const d=addDays(mon,i),key=ymd(d),dow=d.getDay();const ss=DB.sessions.filter(s=>ymd(s.date)===key);const plan=DB.templates.find(t=>t.day===dow);
    let stl='',lab='',lc='var(--mut)';if(ss.length){const c=ss[0].color;stl=`background:${c};border-color:${c};color:${onColor(c)}`;const t=DB.templates.find(x=>x.id===ss[0].templateId);lab=t?tShort(t):'✓';lc=c;}
    else if(plan){stl=`border-color:${plan.color};color:${plan.color};${key<today?'opacity:.35':''}`;lab=tShort(plan);lc=plan.color;}else lab='–';

  return h+'</div>';}
function heatmap(){const weeks=16,start=addDays(mondayOf(new Date()),-7*(weeks-1)),today=ymd(new Date());const by={};DB.sessions.forEach(s=>{(by[ymd(s.date)]=by[ymd(s.date)]||[]).push(s);});
  let m='<div class="heatm">',lastM=-1;for(let w=0;w<weeks;w++){const d=addDays(start,w*7);const mo=d.getMonth();m+=`<span>${mo!==lastM?d.toLocaleDateString('en-GB',{month:'short'}):''}</span>`;lastM=mo;}m+='</div>';
  let h='<div class="heat">';for(let w=0;w<weeks;w++)for(let i=0;i<7;i++){const d=addDays(start,w*7+i),k=ymd(d);const ss=by[k];if(k>today){h+='<i class="f"></i>';continue;}h+=ss?`<i style="background:${ss[0].color}"></i>`:'<i></i>';}

let ui={open:new Set(),sug:{}};
function blankSet(kind='N'){return {kind,kg:'',reps:'',rpe:'',done:false};}
function startSession(tid){
  if(DB.active){if(!confirm('A workout is already in progress. Discard it and start a new one?'))return;Timer.stop();hxClock=null;}
  const t=DB.templates.find(x=>x.id===tid);if(!t)return;const now=new Date();
  const s={id:uid(),templateId:t.id,name:t.name,type:t.type,color:t.color,date:now.toISOString(),start:Date.now(),notes:'',rpe:null,deload:isDeload(now)};
  if(t.type==='strength'){
    s.exercises=t.exercises.map(e=>{const n=s.deload?Math.max(1,Math.round(e.sets*2/3)):e.sets;return {name:e.name,target:'',rpe:'',rest:e.rest,group:e.group||null,sets:Array.from({length:n},()=>blankSet())};});
  }else if(t.type==='run'){const rt=runOfWeek(now);s.run=newRun(rt);s.name='Run – '+RUN_TYPES[rt].name;}
  else if(t.type==='hyrox'){const L=lastLoads();
    s.hyrox={loads:{},blocks:(t.blocks||[]).map(b=>({name:b.name,rounds:b.rounds,rest:b.rest,stations:b.stations.map(x=>({...x})),results:Array.from({length:b.rounds},()=>({splits:b.stations.map(()=>null),total:null}))}))};
    s.hyrox.blocks.forEach(b=>b.stations.forEach(x=>{if(station(x.sid).kg&&s.hyrox.loads[x.sid]==null)s.hyrox.loads[x.sid]=L[x.sid]??'';}));}
  else s.cardio=[{machine:'Bike',min:'',dist:'',hr:'',cal:''}];
  ui={open:new Set(),sug:{}};DB.active=s;save();go('workout');
}
function startEmpty(){

  DB.active={id:uid(),templateId:null,name:'Workout',type:'strength',color:'#64748b',date:new Date().toISOString(),start:Date.now(),notes:'',rpe:null,deload:false,exercises:[]};

function lastLoads(){const L={};sortedSessions().forEach(o=>{if(o.hyrox&&o.hyrox.loads)for(const k in o.hyrox.loads)if(L[k]==null&&o.hyrox.loads[k]!=='')L[k]=o.hyrox.loads[k];});return L;}
function newRun(rt){const R=RUN_TYPES[rt];return {type:rt,distKm:'',time:'',avgHR:'',maxHR:'',reps:R.mode==='intervals'?Array.from({length:R.reps},()=>({dist:'',time:'',hr:''})):[]};}

function restMode(){return DB.settings.restMode||'off';}
function setRestMode(m){DB.settings.restMode=m;if(m!=='timer')Timer.stop();save();renderWorkout();}
const isMain=x=>x.kind==='N'||x.kind==='F';
function mainIndex(e,si){let k=0;for(let i=0;i<si;i++)if(isMain(e.sets[i]))k++;return k;}
/* weight carries over ONLY from the previous set of the same exercise today (warm-up→warm-up, working→working). First set = blank. */
function ghost(ei,si){const e=DB.active.exercises[ei],x=e.sets[si];const W=x.kind==='W';
  for(let j=si-1;j>=0;j--){const y=e.sets[j];if((y.kind==='W')!==W||y.kind==='D')continue;if(y.kg!==''&&y.kg!=null)return {kg:y.kg,reps:''};}

function prevText(ei,si){const e=DB.active.exercises[ei],x=e.sets[si];if(x.kind==='D')return '↘ drop';const last=lastExercise(e.name);if(!last)return '–';
  const same=x.kind==='W'?last.sets.filter(y=>y.done&&y.kind==='W'):last.sets.filter(y=>y.done&&isMain(y));let k=0;for(let i=0;i<si;i++)if(x.kind==='W'?e.sets[i].kind==='W':isMain(e.sets[i]))k++;const p=same[k];return p?`${fmtKg(p.kg)||'BW'}×${p.reps}`:'–';}
function setLabel(e,si){const x=e.sets[si];if(x.kind==='W')return 'W';if(x.kind==='D')return 'D';const n=mainIndex(e,si)+1;return x.kind==='F'?'F'+n:n;}
/* field helpers: kg, reps, partials, d0kg, d0reps … */
function fget(x,f){const m=/^d(\d+)(kg|reps)$/.exec(f);if(m)return (x.drops&&x.drops[+m[1]]||{})[m[2]];return x[f];}
function fset(x,f,v){const m=/^d(\d+)(kg|reps)$/.exec(f);if(m){x.drops[+m[1]][m[2]]=v;}else x[f]=v;}
const isKgF=f=>/kg$/.test(f);
function exCard(s,ei){
  const e=s.exercises[ei];const m=meta(e.name);const rm=restMode();
  const work=e.sets.filter(x=>x.kind!=='W');const complete=work.length&&work.every(x=>x.done);
